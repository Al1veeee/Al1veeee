<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Deni Alimkhanov, Backend Developer (Java / Kotlin)">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 17px; }
    .title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #8B949E; }
    .prompt { fill: #3FB950; font-weight: 700; }
    .cmd { fill: #E6EDF3; }
    .out { fill: #C9D1D9; }
    .name { fill: #F0F6FC; font-weight: 700; }
    .java { fill: #F89820; font-weight: 700; }
    .kt { fill: #A97BFF; font-weight: 700; }
    .dot { fill: #6E7681; }
    .ok { fill: #3FB950; font-weight: 700; }

    .line { opacity: 0; animation: show 0.01s linear forwards; }
    .out-line { opacity: 0; animation: fade 0.45s ease-out forwards; }
    .cover { fill: #161B22; animation-fill-mode: forwards; }
    .t1 { animation-name: type1; animation-timing-function: steps(6); }
    .t2 { animation-name: type2; animation-timing-function: steps(13); }
    .t3 { animation-name: type3; animation-timing-function: steps(14); }
    .cursor { opacity: 0; animation: show 0.01s linear 4.9s forwards, blink 1s step-end 4.9s infinite; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    .cup { fill: #F89820; opacity: 0.9; white-space: pre; }
    .steam { fill: #8B949E; white-space: pre; animation: steam 2.4s ease-in-out infinite; }
    .steam2 { animation-delay: 1.2s; }
    @keyframes steam { 0%, 100% { opacity: 0.15; transform: translateY(2px); } 50% { opacity: 0.8; transform: translateY(-2px); } }

    @keyframes show { to { opacity: 1; } }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes type1 { to { transform: translateX(66px); } }
    @keyframes type2 { to { transform: translateX(142px); } }
    @keyframes type3 { to { transform: translateX(152px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>

  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F89820"/>
      <stop offset="0.5" stop-color="#A97BFF"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <clipPath id="win"><rect x="10" y="10" width="880" height="280" rx="14"/></clipPath>
  </defs>

  <!-- окно терминала -->
  <rect x="10" y="10" width="880" height="280" rx="14" fill="#161B22" stroke="#30363D"/>
  <rect x="10" y="10" width="880" height="3" fill="url(#edge)" clip-path="url(#win)"/>
  <circle cx="38" cy="32" r="6" fill="#FF5F56"/>
  <circle cx="60" cy="32" r="6" fill="#FFBD2E"/>
  <circle cx="82" cy="32" r="6" fill="#27C93F"/>
  <text x="450" y="37" text-anchor="middle" class="title">deni@github: ~</text>
  <line x1="10" y1="52" x2="890" y2="52" stroke="#30363D"/>

  <!-- $ whoami -->
  <g class="line" style="animation-delay:0.3s">
    <text x="40" y="88" class="mono"><tspan class="prompt">$</tspan><tspan class="cmd" x="62">whoami</tspan></text>
    <rect class="cover t1" x="60" y="70" width="560" height="24" style="animation-duration:0.6s;animation-delay:0.4s"/>
  </g>
  <text x="40" y="116" class="mono out-line" style="animation-delay:1.1s"><tspan class="name">Deni Alimkhanov</tspan><tspan class="dot">  ·  </tspan><tspan class="out">Backend Developer </tspan><tspan class="java">Java</tspan><tspan class="out"> / </tspan><tspan class="kt">Kotlin</tspan><tspan class="dot">  ·  </tspan><tspan class="out">Moscow</tspan></text>

  <!-- $ cat stack.txt -->
  <g class="line" style="animation-delay:1.5s">
    <text x="40" y="154" class="mono"><tspan class="prompt">$</tspan><tspan class="cmd" x="62">cat stack.txt</tspan></text>
    <rect class="cover t2" x="60" y="136" width="560" height="24" style="animation-duration:0.9s;animation-delay:1.6s"/>
  </g>
  <text x="40" y="182" class="mono out-line" style="animation-delay:2.7s"><tspan class="out">Spring Boot</tspan><tspan class="dot">  ·  </tspan><tspan class="out">Ktor</tspan><tspan class="dot">  ·  </tspan><tspan class="out">PostgreSQL</tspan><tspan class="dot">  ·  </tspan><tspan class="out">Docker</tspan><tspan class="dot">  ·  </tspan><tspan class="out">GitHub Actions</tspan></text>

  <!-- $ cat status.txt -->
  <g class="line" style="animation-delay:3.1s">
    <text x="40" y="220" class="mono"><tspan class="prompt">$</tspan><tspan class="cmd" x="62">cat status.txt</tspan></text>
    <rect class="cover t3" x="60" y="202" width="560" height="24" style="animation-duration:0.9s;animation-delay:3.2s"/>
  </g>
  <text x="40" y="248" class="mono out-line" style="animation-delay:4.3s"><tspan class="ok pulse">●</tspan><tspan class="ok"> open to work</tspan><tspan class="dot">  ·  </tspan><tspan class="out">Java backend internship</tspan><tspan class="dot">  ·  </tspan><tspan class="out">RTU MIREA, 4th year</tspan></text>

  <!-- кофе для Java -->
  <g class="mono out-line" style="animation-delay:0.3s" xml:space="preserve">
    <text x="740" y="112" class="steam" xml:space="preserve">   ( (</text>
    <text x="740" y="134" class="steam steam2" xml:space="preserve">    ) )</text>
    <text x="740" y="156" class="cup" xml:space="preserve">  ........</text>
    <text x="740" y="178" class="cup" xml:space="preserve">  |      |]</text>
    <text x="740" y="200" class="cup" xml:space="preserve">  \      /</text>
    <text x="740" y="222" class="cup" xml:space="preserve">   `----'</text>
  </g>

  <!-- финальная строка с курсором -->
  <g class="out-line" style="animation-delay:4.9s">
    <text x="40" y="278" class="mono"><tspan class="prompt">$</tspan></text>
  </g>
  <rect class="cursor" x="62" y="263" width="10" height="19" fill="#E6EDF3"/>
</svg>
